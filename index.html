<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>死ぬまでに</title>
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- ?v= は必ずアプリ版数と揃える。これが無いと index.html だけ新しく app.js が古い、という
     混在が起きる(2026-07-29に実際に発生:HTMLはv6.7・JSはv6.6で画面が壊れた)。
     版数を変えるとURLが変わる=端末は必ず取り直す。 -->
<link rel="stylesheet" href="style.css?v=7.0">
</head>
<body>

<!-- ログイン画面 -->
<div id="auth-view" class="view hidden">
  <div class="auth-box">
    <h1>死ぬまでに</h1>
    <p class="muted">メールアドレスにログイン用リンクを送ります。<br>パスワードは不要です。</p>
    <input id="auth-email" type="email" placeholder="メールアドレス" autocomplete="email">
    <button id="auth-send" class="primary">ログインメールを送る</button>
    <div id="otp-area" class="hidden">
      <p class="muted how">📱 アプリの場合:メールの「Sign in」リンクを<b>長押し→リンクをコピー</b>して、下に貼り付け</p>
      <input id="auth-link" type="text" placeholder="ここにリンクを貼り付け">
      <button id="auth-verify" class="primary">ログイン</button>
      <p class="muted how">💻 PCのブラウザなら、メールのリンクをそのまま開くだけでOK</p>
    </div>
    <p id="auth-msg" class="muted"></p>
  </div>
</div>

<!-- 設定不足画面 -->
<div id="setup-view" class="view hidden">
  <div class="auth-box">
    <h1>初期設定が必要です</h1>
    <p class="muted">config.js に Supabase の URL と anon key が入っていません。<br>
    「01_セットアップ手順.md」を見て設定してください。</p>
  </div>
</div>

<!-- アプリ本体:1画面だけ(2026-08-01 v7.0)
     タスク/ルーティン/実績/アイデアのUIは全廃した。賢大の結論=「必要なのはタイムバケットだけ」。
     根拠:TOP3を実際に入れた日は2日(最終7/17)・目標は1件・受信箱は7/3から放置。
     DBのテーブルとデータは1行も消していない。旧UIのコードはgit履歴に全部残っている。 -->
<div id="app-view" class="view hidden">
  <main id="main">

    <!-- 残り時間。ここが主役なので一番上に置く -->
    <div id="life-setup" class="hidden">
      <p class="muted">生年月日を入れると「残り時間」が出ます。</p>
      <div class="row">
        <input id="birthdate" type="date">
        <button id="birthdate-save" class="primary">設定</button>
      </div>
    </div>
    <div id="life-view" class="hidden">
      <p id="life-stats"></p>
      <div id="life-meter"><div id="life-fill"></div></div>
      <p id="life-meter-label" class="muted"></p>
    </div>

    <!-- 追加 -->
    <form id="bucket-form">
      <input id="bucket-name" placeholder="＋ 死ぬまでにやりたいこと" autocomplete="off" enterkeyhint="done" required>
      <div class="row">
        <select id="bucket-horizon">
          <option value="1y">1年以内</option>
          <option value="3y">3年以内</option>
          <option value="5y">5年以内</option>
          <option value="10y">10年以内</option>
          <option value="life" selected>死ぬまでに</option>
        </select>
        <button class="primary" type="submit">追加</button>
      </div>
    </form>

    <div id="bucket-chips" class="chips"></div>
    <ul id="bucket-list" class="list"></ul>

    <p class="ver muted">死ぬまでに v7.0</p>
  </main>
</div>

<script src="config.js"></script>
<script type="module" src="app.js?v=7.0"></script>
</body>
</html>
